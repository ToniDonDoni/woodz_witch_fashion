<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#000000">
<title>WOODZ — Infinite Single Encounters</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#000;color:#d9d3e8}
body{font:11px Arial,sans-serif}
canvas{display:block;width:100%;height:100%;touch-action:manipulation}
.header{position:fixed;top:max(18px,env(safe-area-inset-top));left:20px;right:20px;display:flex;justify-content:space-between;align-items:start;pointer-events:none;opacity:.75}
.brand{letter-spacing:.28em;font-size:17px;font-weight:bold}
.edition{font-size:9px;letter-spacing:.17em;color:#9289a3;line-height:1.6;text-align:right}
.controls{position:fixed;bottom:max(20px,env(safe-area-inset-bottom));left:18px;right:18px;display:flex;gap:12px;align-items:center;justify-content:center}
button{min-height:44px;border:1px solid #9f8bad55;border-radius:32px;background:#111016;color:#d8d1df;padding:0 18px;font-size:10px;letter-spacing:.12em;cursor:pointer}
button:hover{border-color:#cbb0db}
button:focus-visible,input:focus-visible{outline:2px solid #d4bcec;outline-offset:4px}
@media(max-width:350px){button{padding:0 12px;font-size:9px}.controls{gap:8px}}
</style>
</head>
<body>
<canvas id="scene" aria-label="A woman walking on a black stage as one neon chalk apparition appears at a time"></canvas>
<header class="header"><div class="brand">WOODZ</div><div class="edition">INFINITE ENCOUNTERS<br>SINGLE EVENT / EXPERIMENTAL</div></header>
<div class="controls"><button id="play" aria-label="Pause animation">Ⅱ PAUSE</button><button id="dream" aria-label="Create a new dream">NEW DREAM ↗</button></div>
<script>
'use strict';
(()=>{
const canvas=document.getElementById('scene'),ctx=canvas.getContext('2d',{alpha:false});
const atlas=new Image();
const FW=420,FH=790,COLS=6,FRAMES=33;
let w=0,h=0,dpr=1,time=0,last=null,playing=true,ready=false,seed=12731;
let debug={};
__EVENT_CODE__
function resize(){
 w=window.innerWidth;h=window.innerHeight;
 dpr=Math.min(window.devicePixelRatio||1,1.75);
 canvas.width=Math.round(w*dpr);canvas.height=Math.round(h*dpr);
 ctx.setTransform(dpr,0,0,dpr,0,0);
 if(ready)draw();
}
function draw(){
 ctx.fillStyle='#000';ctx.fillRect(0,0,w,h);
 const state=dreamEvents.render(seed,time);
 // The fixed footage-derived walk cycle is intentionally unchanged.
 const height=Math.min(h*.68,w*1.42),width=height*FW/FH;
 const x=(w-width)/2,y=h*.858-height;
 const frame=Math.floor(time*24)%FRAMES;
 ctx.drawImage(atlas,(frame%COLS)*FW,Math.floor(frame/COLS)*FH,FW,FH,x,y,width,height);
 debug={seed,time,frame,viewport:{w,h,dpr},figure:{x,y,width,height},
       activeEventCount:state.activeEventCount,slot:state.slot,slotEmpty:state.slotEmpty,
       event:state.event,phase:state.phase};
 return debug;
}
function tick(now){
 if(last!==null&&playing&&!document.hidden)
  time+=Math.min((now-last)/1000,.05);
 last=now;
 if(ready&&playing)draw();
 requestAnimationFrame(tick);
}
function setPlaying(v){
 playing=!!v;last=null;
 const b=document.getElementById('play');
 b.textContent=playing?'Ⅱ PAUSE':'▶ PLAY';
 b.setAttribute('aria-label',playing?'Pause animation':'Play animation');
}
document.getElementById('play').onclick=()=>setPlaying(!playing);
document.getElementById('dream').onclick=()=>{
 seed=(seed+7919)|0;
 time=0;
 if(ready)draw();
};
window.addEventListener('resize',resize);
document.addEventListener('visibilitychange',()=>{last=null});
window.runway={
 seek(t){setPlaying(false);time=Math.max(0,t);return ready?draw():null},
 seekSlot(n){return this.seek(Math.max(0,Math.floor(n))*dreamEvents.SLOT)},
 seekEvent(n){
  const spec=dreamEvents.specForSlot(seed,n);
  if(spec.empty)return {emptySlot:true,slot:n};
  return this.seek(n*dreamEvents.SLOT+spec.leading);
 },
 setSeed(s){seed=s|0;time=0;return ready?draw():null},
 spec(n){return dreamEvents.specForSlot(seed,n)},
 state(){return debug},
 play(){setPlaying(true)},
 get ready(){return ready}
};
atlas.onload=()=>{
 ready=true;
 draw();
};
atlas.onerror=()=>{document.querySelector('.edition').textContent='SPRITE ATLAS FAILED'};
resize();
atlas.src='data:image/webp;base64,__ATLAS_DATA__';
requestAnimationFrame(tick);
})();
</script>
</body>
</html>
