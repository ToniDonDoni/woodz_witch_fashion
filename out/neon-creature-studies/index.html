function configure(canvas){
 const resolution=Math.min(devicePixelRatio||1,1.7);
 const edge=Math.min(650,Math.max(1,Math.round(canvas.clientWidth*resolution)));
 if(canvas.width!==edge||canvas.height!==edge){canvas.width=edge;canvas.height=edge;}
}
function drawStudy(canvas,index){
 const study=studies[index],paper=canvas.getContext('2d');configure(canvas);
 let layer=layers.get(canvas);if(!layer){layer=document.createElement('canvas');layers.set(canvas,layer);}if(layer.width!==canvas.width||layer.height!==canvas.height){layer.width=canvas.width;layer.height=canvas.height;}
 const c=paper;paper.setTransform(canvas.width/SIZE,0,0,canvas.height/SIZE,0,0);
 c.fillStyle='#080d0c';c.fillRect(0,0,SIZE,SIZE);c.lineJoin='round';c.lineCap='round';
 const glow=c.createRadialGradient(210,214,18,210,214,198);glow.addColorStop(0,study.color+'0b');glow.addColorStop(1,'#080d0c00');c.fillStyle=glow;c.fillRect(0,0,SIZE,SIZE);
 // Fixed paper grain belongs to the paper, so it never flashes with the contour.
 for(let k=0;k<300;k++){const x=hash(k*37+20003)*SIZE,y=hash(k*91+40001)*SIZE;c.fillStyle=k%2?'#afcfb709':'#dcffd805';c.fillRect(x,y,.8,.8);}
 const art=layer.getContext('2d');art.setTransform(1,0,0,1,0,0);art.clearRect(0,0,layer.width,layer.height);art.setTransform(layer.width/SIZE,0,0,layer.height/SIZE,0,0);art.lineCap='round';art.lineJoin='round';
 const b=brush(art,study,index);forestFloor(b,index);art.save();
 art.translate(210,250);art.rotate(Math.sin(time*.45+index)*.003);art.translate(-210,-250);
 study.draw(b,index);art.restore();
 // One glow composite per drawing avoids a blur operation for every stroke.
 paper.setTransform(1,0,0,1,0,0);paper.shadowColor=study.color;paper.shadowBlur=9;paper.globalAlpha=.65;paper.drawImage(layer,0,0);paper.shadowBlur=0;paper.globalAlpha=1;paper.drawImage(layer,0,0);
}
function render(all=false){phase=Math.floor(time*12);if(!dialog.open||all)canvases.forEach((canvas,i)=>{const r=canvas.getBoundingClientRect();if(all||(r.bottom>0&&r.top<innerHeight))drawStudy(canvas,i);});if(dialog.open&&selected>=0)drawStudy(large,selected);}
for(let i=0;i<studies.length;i++){
 const study=studies[i],card=document.createElement('article');card.className='card';card.style.setProperty('--ink',study.color);
 const button=document.createElement('button');button.className='art-button';button.setAttribute('aria-label','Enlarge '+study.name);
 const canvas=document.createElement('canvas');canvas.className='art';canvas.setAttribute('role','img');canvas.setAttribute('aria-label',study.name+', animated neon chalk '+study.kind.toLowerCase());
 const label=document.createElement('span');label.className='zoom';label.textContent='LOOK CLOSER ↗';button.append(canvas,label);
 const meta=document.createElement('div');meta.className='meta';meta.innerHTML='<div class="id">'+study.id+'<span>'+study.kind+'</span></div><h2>'+study.name+'</h2><p>'+study.note+'</p>';
 button.onclick=()=>{selected=i;document.querySelector('#modal-id').textContent=study.id+' / '+study.kind;document.querySelector('#modal-name').textContent=study.name;large.setAttribute('aria-label',study.name+', enlarged neon chalk drawing');dialog.showModal();drawStudy(large,i);};
 card.append(button,meta);document.querySelector('#gallery').append(card);canvases.push(canvas);
}
document.querySelector('#close').onclick=()=>dialog.close();
dialog.addEventListener('click',e=>{if(e.target===dialog){const r=dialog.getBoundingClientRect();if(e.clientX<r.left||e.clientX>r.right||e.clientY<r.top||e.clientY>r.bottom)dialog.close();}});
const play=document.querySelector('#play');
function setPlaying(value){playing=value;last=null;play.textContent=value?'Ⅱ PAUSE':'▶ ANIMATE';play.setAttribute('aria-label',value?'Pause sketches':'Animate sketches');}
play.onclick=()=>setPlaying(!playing);
document.querySelector('#energy').oninput=e=>{energy=Number(e.target.value);render();};
document.querySelector('#remix').onclick=()=>{seed=(seed+7919)|0;render();};
document.addEventListener('visibilitychange',()=>{last=null;});
window.addEventListener('resize',()=>render());window.addEventListener('scroll',()=>{if(!playing)render();},{passive:true});
window.studies={seek(t){setPlaying(false);time=Math.max(0,t);render(true);return this.state();},play(){setPlaying(true);},state(){return {time,phase,seed,energy,count:studies.length,ids:studies.map(s=>s.id)};}};
function tick(now){if(last!==null&&playing&&!document.hidden)time+=Math.min((now-last)/1000,.1);last=now;const next=Math.floor(time*12);if(playing&&next!==lastPhase){render();lastPhase=next;}requestAnimationFrame(tick);}
render();requestAnimationFrame(tick);
})();
</script>
