<!doctype html>
<html lang="en">

<title>Woodz — Forest Casting / GPT</title>
<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#050507;color:#eee8df}body{font:12px Arial,sans-serif}canvas{display:block;width:100%;height:100%;touch-action:manipulation}.masthead{position:fixed;top:max(25px,env(safe-area-inset-top));left:28px;right:28px;display:flex;align-items:start;justify-content:space-between;pointer-events:none}.brand{font-size:19px;letter-spacing:.24em;font-weight:600}.edition{font-size:9px;letter-spacing:.19em;color:#a49ba9;line-height:1.7;text-align:right}.caption{position:fixed;left:28px;top:83px;pointer-events:none}.caption h1{font:italic 30px Georgia,serif;margin:0 0 7px}.caption p{font-size:9px;letter-spacing:.17em;text-transform:uppercase;color:#aaa0ad;margin:0}.controls{position:fixed;bottom:max(22px,env(safe-area-inset-bottom));left:25px;right:25px;display:flex;align-items:center;justify-content:space-between;gap:14px}button{color:#dcd2df;background:#131017cc;border:1px solid #d9bfe62a;border-radius:100px;min-height:44px;padding:0 17px;font:10px Arial,sans-serif;letter-spacing:.1em;cursor:pointer}button:hover{border-color:#b693c9}button:focus-visible,input:focus-visible{outline:2px solid #d2b2ec;outline-offset:5px}.tempo{display:flex;align-items:center;gap:9px;color:#9c92a4;font-size:9px;letter-spacing:.08em}.tempo input{width:75px;accent-color:#c3a2dc}.hint{position:fixed;bottom:87px;left:0;right:0;text-align:center;color:#665a70;font-size:8px;letter-spacing:.23em;pointer-events:none}#actcard{position:fixed;bottom:118px;left:0;right:0;text-align:center;color:#ead9fb;font-size:11px;letter-spacing:.34em;text-shadow:0 0 18px #000000cc;opacity:0;pointer-events:none}#loading{position:fixed;top:50%;left:0;right:0;text-align:center;color:#cbb0e0;letter-spacing:.15em}@media(max-height:550px){.caption{top:65px}.caption h1{font-size:23px}.hint{display:none}.controls{bottom:12px}.masthead{top:18px}}
@media(max-width:500px) and (max-height:700px){.caption{top:65px}.caption h1{font-size:23px}.caption p,.hint{display:none}.controls{left:16px;right:16px;gap:9px}button{padding:0 12px;white-space:nowrap;font-size:9px}.tempo{gap:6px}.tempo input{width:50px}}
.actions{display:flex;gap:8px}.caption h1{font-size:clamp(28px,4vw,47px);font-weight:400}.caption{top:90px}.caption p{font-size:8px;letter-spacing:.2em}.brand{font-weight:400}.edition{font-size:8px}#actcard{font-size:8px;letter-spacing:.22em;color:#b4ae9d}.hint{font-size:7px}button{border-radius:2px;background:#11151699;border-color:#9ca39444;font-size:9px;color:#d4d6c6}.tempo input{accent-color:#b6bba2}@media(max-width:550px){.masthead{left:20px;right:20px}.caption{left:20px;top:78px}.caption h1{font-size:31px}.controls{left:16px;right:16px;gap:6px}.tempo{display:none}button{padding:0 11px;min-height:44px}.actions{gap:6px}.edition{font-size:7px}.caption p{font-size:7px}}@media(max-height:500px){.caption{top:52px}.caption h1{font-size:25px}.caption p{display:none}#actcard{bottom:70px}}
</style>
</head>
<body>
<canvas id="scene" aria-label="A woman walking on an infinite illustrated forest runway while the woodland stages a new enchanted act around her"></canvas>
<header class="masthead"><div class="brand">WOODZ</div><div class="edition">INFINITE RUNWAY<br>FOREST CASTING / GPT · II</div></header>
<div class="caption"><h1>Forest casting.</h1><p>An endless show. An unlikely front row.</p></div>
<div id="loading" role="status">Taking our seats…</div>
<div id="actcard" aria-hidden="true"></div>
<div class="hint">THE FOREST IS WATCHING</div>
<div class="controls"><button id="play" aria-label="Pause animation">Ⅱ PAUSE</button><label class="tempo">PACE <input id="pace" aria-label="Walking pace" type="range" min="0.6" max="1.6" value="1" step="0.1"></label><div class="actions"><button id="next" aria-label="Skip to the next encounter">NEXT GUEST ↗</button><button id="dream" aria-label="Generate a new forest">NEW DREAM</button></div></div>
<script>
'use strict';
(() => {
const canvas=document.querySelector('#scene'),ctx=canvas.getContext('2d',{alpha:false}),actCard=document.querySelector('#actcard');
const atlas=new Image();
const TAU=Math.PI*2,FRAME_COUNT=33,FW=420,FH=790,COLS=6;
const colors=[['#d8a6ff','#8052cc','#f4d2ff'],['#ffd88c','#de7d49','#fff0bd'],['#7de4d0','#328eab','#c1fff1'],['#ffa1c8','#a9437a','#ffd7de'],['#98bdff','#596ecc','#dbeaff']];
let w=0,h=0,dpr=1,time=0,last=null,playing=!matchMedia('(prefers-reduced-motion: reduce)').matches,pace=1,seed=(crypto.getRandomValues(new Uint32Array(1))[0]&0x7fffffff),ready=false,boil=0;
let foregroundEnabled=true,actCardText='';
let debug={};
function rand(n){let x=(n^seed)|0;x=Math.imul(x^(x>>>16),0x45d9f3b);x=Math.imul(x^(x>>>16),0x45d9f3b);return ((x^(x>>>16))>>>0)/4294967296;}
function nrand(n){return rand(n)*2-1;}
function jitter(id,k){return nrand(id*173+k*919+boil*107)*.68;}
function resize(){w=innerWidth;h=innerHeight;dpr=Math.min(devicePixelRatio||1,1.75);canvas.width=Math.round(w*dpr);canvas.height=Math.round(h*dpr);ctx.setTransform(dpr,0,0,dpr,0,0);if(ready)draw();}
function line(points,color,width=1,id=0){ctx.beginPath();points.forEach((p,i)=>{const x=p[0]+jitter(id,i*2),y=p[1]+jitter(id,i*2+1);i?ctx.lineTo(x,y):ctx.moveTo(x,y)});ctx.strokeStyle=color;ctx.lineWidth=width;ctx.stroke();}
function ellipse(x,y,rx,ry,color){ctx.beginPath();ctx.ellipse(x,y,rx,ry,0,0,TAU);ctx.fillStyle=color;ctx.fill();}
__FOREST_CODE__
__PASSING_CODE__
function pathHeight(x){return h*.84+Math.sin(x/w*2.7+.5)*h*.012;}
function drawPath(){
 const top=h*.785,bottom=h*.936;
 const wash=ctx.createLinearGradient(0,top,0,bottom);wash.addColorStop(0,'#0b0910');wash.addColorStop(.45,'#18121f');wash.addColorStop(1,'#050507');ctx.fillStyle=wash;ctx.fillRect(0,top,w,bottom-top);
 // Parallel chalk tracks. World coordinates translate continuously to the right.
 const unit=Math.min(h/850,1.2),speed=82*unit,spacing=66*unit,offset=time*speed;
 const start=Math.floor((-offset-150)/spacing),end=Math.ceil((w-offset+150)/spacing);
 const objects=[];
 for(let i=start;i<=end;i++){
   const id=i*23+8001,x=i*spacing+offset,yp=pathHeight(x);
   objects.push({id:i,x});
   for(let row=0;row<5;row++){
     const a=rand(id+row*19),length=(30+a*45)*unit,xx=x+rand(id+row*71)*19*unit,y=yp+(row-1.8)*16*unit;
     const tone=['#9774b65b','#c5a8cc65','#daa6b745','#839ac04f','#b995b841'][row];
     line([[xx-length*.5,y+4],[xx,y+nrand(id+row)*2],[xx+length*.5,y-2]],tone,.8+row*.1,id+row);
     if(row===1||row===3)line([[xx-length*.5,y+4],[xx-length*.5-8*unit,y+12*unit]],'#b699bd35',.8,id+row+40);
   }
   // Small plants along the moving edges, each derived from a stable world ID.
   if(rand(id+77)>.28){
     const y=yp+(rand(id+40)>.5?43:-39)*unit,stem=(10+rand(id+34)*16)*unit;
     line([[x,y],[x+2,y-stem]],'#85928588',.8,id+100);
     for(let k=0;k<3;k++){const py=y-stem*k/3;line([[x+1,py],[x-6*unit,py-6*unit],[x-2,py-3]],'#839d8b77',.7,id+k+101);}
     if(rand(id+43)>.5){const c=colors[Math.floor(rand(id+91)*colors.length)][0];for(let p=0;p<5;p++){let a=p*TAU/5;ellipse(x+2+Math.cos(a)*3*unit,y-stem+Math.sin(a)*3*unit,2*unit,1.3*unit,c+'a0');}}
   }
 }
 // The lane edges stay in place while their chalk dashes pass beneath her.
 for(let edge of [-34,44]){const pts=[];for(let x=-10;x<w+20;x+=24)pts.push([x,pathHeight(x)+edge*unit]);line(pts,'#b894c33b',.7,edge+600);}
 return objects;
}
function draw(){
 boil=Math.floor(time*12);ctx.setTransform(dpr,0,0,dpr,0,0);ctx.fillStyle='#080c0f';ctx.fillRect(0,0,w,h);ctx.lineJoin='round';ctx.lineCap='round';
 drawNightSky();
 const woodland=drawForestBackground();
 // Keep the trees hushed so pale paper-cut visitors can read at a glance.
 ctx.fillStyle='#0a101777';ctx.fillRect(0,0,w,h*.80);
 const path=drawPath(),forest=drawForestGround(woodland);
 // A pool of chalk-white runway light behind the unchanged photographed figure.
 const wash=ctx.createRadialGradient(w*.5,h*.58,0,w*.5,h*.58,h*.42);wash.addColorStop(0,'#707c702a');wash.addColorStop(1,'#707c7000');ctx.fillStyle=wash;ctx.fillRect(0,0,w,h);
 const visitors=visitorsAt(time),back=drawVisitors(visitors,false);
 const figureHeight=Math.min(h*.64,w*1.30),figureWidth=figureHeight*FW/FH;
 const x=(w-figureWidth)/2,y=h*.848-figureHeight;
 ellipse(w*.5-figureWidth*.08,h*.842,figureWidth*.38,figureHeight*.012,'#00000080');
 const frame=Math.floor(time*24)%FRAME_COUNT;
 ctx.drawImage(atlas,(frame%COLS)*FW,Math.floor(frame/COLS)*FH,FW,FH,x,y,figureWidth,figureHeight);
 const front=drawVisitors(visitors,true),foreground=foregroundEnabled?drawForestForeground(woodland):[];
 pruneForestCache(woodland.used);
 const events=[...back,...front];
 debug={time,frame,boil,seed,playing,pace,viewport:{w,h},figure:{x,y,width:figureWidth,height:figureHeight},forest,foreground,
 events:events.map(e=>({index:e.index,type:e.type,signature:e.signature,form:e.form,action:e.action,p:e.p,x:e.x,y:e.y,front:e.front,count:e.count,palette:e.palette,width:e.width,height:e.height,cargo:e.cargo})),
 cacheSize:forestCache.size,activeCount:forest.length+foreground.length+events.length};
}
function tick(now){if(last!==null&&playing&&!document.hidden)time+=Math.min((now-last)/1000,.05)*pace;last=now;if(ready&&playing)draw();requestAnimationFrame(tick);}
const play=document.querySelector('#play');
function setPlaying(value){playing=value;last=null;play.textContent=playing?'Ⅱ PAUSE':'▶ PLAY';play.setAttribute('aria-label',playing?'Pause animation':'Play animation');}
play.onclick=()=>setPlaying(!playing);
setPlaying(playing);
document.querySelector('#next').onclick=()=>{time=(Math.floor(time/24)+1)*24;last=null;if(ready)draw()};
document.querySelector('#pace').oninput=e=>{pace=Number(e.target.value)};
document.querySelector('#dream').onclick=()=>{seed=(seed+7919)|0;forestCache.clear();time=0;if(ready)draw()};
document.addEventListener('visibilitychange',()=>{last=null});window.addEventListener('resize',resize);
// Deterministic review controls; they do not load assets or alter the selected walk cycle.
window.runway={setSeed(value){seed=value|0;forestCache.clear();if(ready)draw();return debug},seek(t){setPlaying(false);time=Math.max(0,t);if(ready)draw();return debug},play(){setPlaying(true)},state(){return debug},
 programme(count=16){return Array.from({length:count},(_,i)=>encounter(i))},plan(index){return encounter(index)},
 setForeground(on){foregroundEnabled=!!on;if(ready)draw();return debug},get ready(){return ready}};
atlas.onload=()=>{ready=true;document.querySelector('#loading').remove();draw()};atlas.onerror=()=>{document.querySelector('#loading').textContent='The embedded walk frames could not be loaded.'};
resize();atlas.src='data:image/webp;base64,__ATLAS_DATA__';requestAnimationFrame(tick);
})();
</script>
</body>
