<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Woodz Witch Fashion</title><style>html,body{margin:0;overflow:hidden;background:#07110b}canvas{width:100vw;height:100vh;display:block}</style></head><body><canvas id="c"></canvas><script>
const c=document.querySelector("canvas"),g=c.getContext("2d"),imgs=[];for(let i=0;i<33;i++){let m=new Image;m.src="https://raw.githubusercontent.com/ToniDonDoni/woodz_witch_fashion/main/assets/walk/sprite_"+String(i).padStart(3,"0")+".png";imgs.push(m)}
let W,H,d=1,t0=performance.now();const R=Math.PI*2,hash=n=>{n=Math.imul(n^n>>>16,2246822507);return((n^n>>>13)>>>0)/4294967296},rnd=(s,k=0)=>hash(s+k*7919);
function resize(){d=Math.min(devicePixelRatio||1,2);W=innerWidth;H=innerHeight;c.width=W*d;c.height=H*d;g.setTransform(d,0,0,d,0,0)}resize();onresize=resize;

function tree(x,y,s,seed,front){let h=(180+rnd(seed)*180)*s,w=22*s;g.fillStyle=front?"#241b17":"#26391f";g.beginPath();g.moveTo(x-w,y);g.bezierCurveTo(x-w,y-h*.4,x-w*1.4,y-h*.7,x,y-h);g.bezierCurveTo(x+w*1.3,y-h*.7,x+w,y-h*.35,x+w,y);g.fill();for(let k=0;k<5;k++){let yy=y-h*(.45+k*.1),side=k%2?1:-1,len=(55+rnd(seed,k)*55)*s;g.strokeStyle="#49643f";g.lineWidth=3*s;g.beginPath();g.moveTo(x,yy);g.lineTo(x+side*len,yy-len*.35);g.stroke();ell(x+side*len,yy-len*.35,20*s,10*s,front?"#23451f":"#31592d")}}
function mush(x,y,s,seed,t){let q=Math.sin(t*3+seed)*3;g.fillStyle="#ead9b7";g.fillRect(x-4*s+q,y-24*s,8*s,24*s);ell(x+q,y-27*s,17*s,9*s,["#d74f75","#e7a83f","#8d5eb8"][seed%3]);ell(x-6*s+q,y-29*s,2*s,2*s,"#fff0cc");ell(x+7*s+q,y-26*s,2*s,2*s,"#fff0cc")}
function stump(x,y,s){g.fillStyle="#65482e";g.fillRect(x-18*s,y-34*s,36*s,34*s);ell(x,y-34*s,18*s,6*s,"#a77c4c")}
function leshy(x,y,s,seed,t){let q=Math.sin(t*2+seed)*3;g.save();g.translate(x,y+q);g.fillStyle="#3d6132";g.beginPath();g.moveTo(-22*s,0);g.quadraticCurveTo(-28*s,-70*s,0,-92*s);g.quadraticCurveTo(28*s,-70*s,22*s,0);g.fill();ell(0,-96*s,22*s,28*s,"#617b47");g.strokeStyle="#59422b";g.lineWidth=3*s;for(let side of [-1,1]){g.beginPath();g.moveTo(side*10*s,-112*s);g.lineTo(side*28*s,-145*s);g.lineTo(side*20*s,-163*s);g.stroke()}ell(-8*s,-99*s,3*s,3*s,"#f6d45e");ell(8*s,-99*s,3*s,3*s,"#f6d45e");g.restore()}
function obj(i,l,t){let sp=150+l*65,x=(i*sp+rnd(i+l*99)*80+t*82*(.5+l*.25))%(W+sp*2)-sp,y=H*(.62+l*.13)+rnd(i,4)*H*.07,s=.55+l*.23+rnd(i,3)*.22,type=i%9;if(type===0)leshy(x,y,s,i,t);else if(type===2||type===5)mush(x,y,s,i,t);else if(type===4)stump(x,y,s);else tree(x,y,s,i,l===2)}
function draw(n){let t=(n-t0)/1000,gr=g.createLinearGradient(0,0,0,H);gr.addColorStop(0,"#071a12");gr.addColorStop(.55,"#21462a");gr.addColorStop(1,"#09140d");g.fillStyle=gr;g.fillRect(0,0,W,H);
for(let l=0;l<3;l++){g.fillStyle=["#102719","#17351f","#204329"][l];g.beginPath();g.moveTo(0,H);for(let x=-100;x<W+150;x+=90)g.lineTo(x,H*(.4+l*.07)+Math.sin(x*.025+t*.15)*35);g.lineTo(W,H);g.fill()}
let hy=H*.57;g.fillStyle="#776b58";g.beginPath();g.moveTo(W*.44,hy);g.lineTo(W*.56,hy);g.lineTo(W*.84,H);g.lineTo(W*.16,H);g.fill();

let f=Math.floor(t*24)%33,im=imgs[f];if(im.complete){let sc=Math.min(H*.82/790,W*.62/420),w=420*sc,h=790*sc;g.save();g.shadowColor="#000b";g.shadowBlur=22;g.drawImage(im,(W-w)/2,H*.94-h,w,h);g.restore()}
for(let i=0;i<14;i++)obj(i+31,2,t);requestAnimationFrame(draw)}requestAnimationFrame(draw);
