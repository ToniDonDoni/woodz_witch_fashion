<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>WOODZ — Forest Couture Buyers</title><style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;background:#000;overflow:hidden;color:#e5d7d5;font:12px system-ui}canvas{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}#audience{z-index:1}#model{z-index:2}.ui{position:fixed;z-index:3;left:24px;top:18px;pointer-events:none}.title{font:italic 42px Georgia,serif;letter-spacing:-.03em}.sub{font-size:10px;letter-spacing:.23em;color:#a79b9d;margin-top:6px}.controls{position:fixed;bottom:max(20px,env(safe-area-inset-bottom));left:0;right:0;display:flex;justify-content:center;gap:12px;z-index:4}button{background:#151116d9;border:1px solid #8e7789;color:#e9dce7;padding:14px 19px;cursor:pointer;letter-spacing:.12em}button:focus-visible{outline:2px solid white}@media(max-width:600px){.title{font-size:27px}.ui{left:14px}.controls{gap:6px}button{padding:12px 9px;font-size:10px}}
</style></head><body><canvas id="audience"></canvas><canvas id="model"></canvas><div class="ui"><div class="title">Forest couture.</div><div class="sub">THE BIRCH WITCH FRONT ROW / WOODZ</div></div><div class="controls"><button id="pause">Ⅱ PAUSE</button><button id="next">NEW CAST ✧</button></div><script>
__AUDIENCE_CODE__
(()=>{'use strict';const a=document.getElementById('audience'),m=document.getElementById('model');const c=a.getContext('2d'),mc=m.getContext('2d');const img=new Image();const FW=420,FH=790,COLS=6,FRAMES=33;let w=0,h=0,ratio=1,seed=42,playing=true,time=0,last=0,ready=false;
function resize(){w=innerWidth;h=innerHeight;ratio=Math.min(devicePixelRatio||1,1.4);for(const v of [a,m]){v.width=Math.round(w*ratio);v.height=Math.round(h*ratio)}for(const ctx of [c,mc])ctx.setTransform(ratio,0,0,ratio,0,0);draw()}
function draw(){forestBuyers.draw(c,w,h,time,seed);mc.clearRect(0,0,w,h);if(ready){const height=Math.min(h*.71,w*1.36),width=height*FW/FH;const x=(w-width)*.5,y=h*.90-height;const f=Math.floor(time*24)%FRAMES;mc.drawImage(img,(f%COLS)*FW,Math.floor(f/COLS)*FH,FW,FH,x,y,width,height)} }
function frame(now){if(playing&&last&&ready)time+=Math.min(.05,Math.max(0,(now-last)/1000));last=now;if(playing)draw();requestAnimationFrame(frame)}
function newSeed(){try{const a=new Uint32Array(1);crypto.getRandomValues(a);return a[0]}catch(_){return Date.now()}}
document.getElementById('pause').onclick=()=>{playing=!playing;last=0;document.getElementById('pause').textContent=playing?'Ⅱ PAUSE':'▶ PLAY';draw()};document.getElementById('next').onclick=()=>{seed=newSeed();draw()};window.addEventListener('resize',resize);img.onload=()=>{ready=true;draw()};img.src='data:image/webp;base64,__ATLAS_DATA__';window.runway={get ready(){return ready},state(){return {seed,time,ready,width:w,height:h,cast:forestBuyers.kinds}},seek(t){playing=false;time=t;draw();return this.state()},setSeed(s){seed=s;draw();return this.state()}};resize();requestAnimationFrame(frame)})();
</script></body></html>
