name: Check three procedural effects
on:
  pull_request:
    paths:
      - "out/teknium-three-effects/**"
      - "site/teknium-three-effects/**"
      - ".github/workflows/check-teknium-three-effects.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: node out/teknium-three-effects/verify.cjs
