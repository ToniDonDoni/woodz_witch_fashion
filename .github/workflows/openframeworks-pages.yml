name: Build openFrameworks WASM site

on:
  push:
    branches: [codex/openframeworks-effects]
  pull_request:
    paths:
      - '.github/workflows/openframeworks-pages.yml'
      - 'out/openframeworks-wasm-prototype/**'
      - 'scripts/build_openframeworks_pages.sh'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  wasm-site:
    runs-on: ubuntu-22.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: Install build tools
        run: |
          sudo apt-get update && sudo apt-get install -y make python3 python3-pip git pkg-config
          python3 -m pip install Pillow
      - name: Install Emscripten
        uses: emscripten-core/setup-emsdk@v15
        with:
          version: 'latest'
      - name: Compile openFrameworks and package static site
        run: bash scripts/build_openframeworks_pages.sh
      - name: Verify deployable site
        run: |
          test -s dist/openframeworks/index.html
          test -s dist/openframeworks/legacy/index.html
          test -s dist/openframeworks/wasm/index.html
          grep -q 'JavaScript' dist/openframeworks/index.html
          grep -q 'WebAssembly' dist/openframeworks/index.html
          test -n "$(find dist/openframeworks -type f -name '*.wasm' -print -quit)"
          test -n "$(find dist/openframeworks -type f -name '*.js' -print -quit)"
          python3 -m http.server 8765 --directory dist/openframeworks &
          SERVER_PID=$!
          trap 'kill "$SERVER_PID"' EXIT
          sleep 2
          curl --fail --silent http://localhost:8765/ > /dev/null
      - name: Upload deployable Pages artifact
        uses: actions/upload-artifact@v4
        with:
          name: openframeworks-pages-site
          path: dist/openframeworks/
          if-no-files-found: error
          retention-days: 14
      - name: Upload GitHub Pages deployment artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist/openframeworks/

  deploy-preview:
    needs: wasm-site
    if: github.event_name == 'push' && github.ref == 'refs/heads/codex/openframeworks-effects'
    runs-on: ubuntu-22.04
    concurrency:
      group: openframeworks-pages-preview
      cancel-in-progress: true
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy preview to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
