name: Publish Site

on:
  workflow_dispatch:

permissions:
  actions: read
  contents: read
  pages: write
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-22.04
    concurrency:
      group: site-pages-publish
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Download verified site artifact for selected commit
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          COMMIT: ${{ github.sha }}
        run: |
          set -euo pipefail
          RUN_ID="$(gh api -X GET "repos/$REPO/actions/workflows/openframeworks-pages.yml/runs" \
            -f head_sha="$COMMIT" -f status=success -f per_page=100 \
            --jq '[.workflow_runs[] | select(.event == "push")] | first | .id // empty')"
          if [ -z "$RUN_ID" ]; then
            echo "::error::No successful Build & Test Site push run for commit $COMMIT. Push this commit and wait for CI before publishing."
            exit 1
          fi
          mkdir -p dist/openframeworks
          gh run download "$RUN_ID" --repo "$REPO" --name openframeworks-pages-site --dir dist/openframeworks
          test -s dist/openframeworks/index.html
          test -s dist/openframeworks/wasm/index.html
          test -n "$(find dist/openframeworks -type f -name '*.wasm' -print -quit)"
          echo "Publishing tested artifact from run $RUN_ID for commit $COMMIT"
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist/openframeworks/
      - name: Publish to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
